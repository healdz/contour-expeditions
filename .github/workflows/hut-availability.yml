# Refreshes hut availability for the Swiss Via Alpina calendar.
# Writes swiss-via-alpina.json to the availability-data branch (one commit,
# replaced each run) so the main branch history stays clean.
name: Hut availability

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:          # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths:
      - tools/hut_availability.py
      - .github/workflows/hut-availability.yml

permissions:
  contents: write

concurrency:
  group: hut-availability
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch availability
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          python3 tools/hut_availability.py "$RUNNER_TEMP/out/swiss-via-alpina.json"

      - name: Publish to availability-data branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$RUNNER_TEMP/out"
          git init -q -b availability-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add swiss-via-alpina.json
          git commit -q -m "Hut availability $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" availability-data
