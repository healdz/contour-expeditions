<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&family=Oswald:wght@500&display=swap">
<style>html,body,#m{margin:0;height:100%;width:100%}
.lbl{background:#fff;border:1.5px solid #1f2326;border-radius:2px;padding:2px 6px;font:600 13px Inter,sans-serif;color:#1f2326;box-shadow:none;white-space:nowrap}
.lbl small{display:block;font-weight:500;font-size:11px;color:#4a535b}
.lbl.hut{border-color:#c8553d}
.leaflet-tooltip.lbl:before{display:none}
.title{position:absolute;z-index:1000;top:14px;left:14px;background:rgba(255,255,255,.94);border:1.5px solid #1f2326;padding:8px 12px;font:500 15px Oswald,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#1f2326}
.title span{display:block;font:500 11px Inter,sans-serif;letter-spacing:0;text-transform:none;color:#4a535b;margin-top:2px}
.north{position:absolute;z-index:1000;top:14px;right:14px;background:rgba(255,255,255,.94);border:1.5px solid #1f2326;width:38px;height:46px;text-align:center;font:500 13px Oswald,sans-serif;padding-top:4px;box-sizing:border-box}
.daytag{background:#c8553d;color:#fff;border:0;border-radius:10px;font:600 11px Inter,sans-serif;padding:1px 7px;box-shadow:none}
.daytag:before{display:none}
.leaflet-control-scale-line{font:500 11px Inter,sans-serif;border-color:#1f2326;background:rgba(255,255,255,.85)}
.leaflet-control-attribution{font:10px Inter,sans-serif}
</style></head><body><div id="m"></div>
<div class="title">Swiss Alps: Via Alpina<span>Lauterbrunnen → Kandersteg · 4 days / 3 nights · route on marked trails</span></div>
<div class="north"><svg width="18" height="20" viewBox="0 0 20 24"><path d="M10 1 17 22 10 17 3 22z" fill="#1f2326"/></svg><div style="margin-top:-4px">N</div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
var LINES = __LINES__, PTS = __PTS__;
var map = L.map('m', {zoomControl:false, zoomSnap:0.25});
L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {maxZoom:17,
  attribution:'Map data: &copy; OpenStreetMap contributors, SRTM | Map style: &copy; OpenTopoMap (CC-BY-SA)'}).addTo(map);
var all = [];
LINES.forEach(function(l){ all = all.concat(l);
  L.polyline(l, {color:'#fff', weight:8, opacity:.9}).addTo(map);
  L.polyline(l, {color:'#c8553d', weight:4, opacity:1}).addTo(map); });
LINES.forEach(function(l, i){ var mid = l[Math.floor(l.length*0.5)];
  L.marker(mid, {opacity:0, interactive:false}).addTo(map).bindTooltip('Day '+(i+1), {permanent:true, className:'daytag', direction:'center'}); });
var dirs = {"Lauterbrunnen":"left","Mürren":"right","Rotstockhütte":"top","Sefinenfurgge":"right","Gspaltenhornhütte":"bottom","Hohtürli":"left","Blüemlisalphütte":"right","Oeschinensee":"bottom","Kandersteg":"left"};
PTS.forEach(function(p){
  var style = p[3]==='hut' ? {radius:8, color:'#1f2326', weight:2, fillColor:'#c8553d', fillOpacity:1}
            : p[3]==='pass' ? {radius:6, color:'#1f2326', weight:2, fillColor:'#fff', fillOpacity:1}
            : p[3]==='start' ? {radius:8, color:'#fff', weight:3, fillColor:'#1f2326', fillOpacity:1}
            : {radius:5, color:'#1f2326', weight:2, fillColor:'#fff', fillOpacity:1};
  L.circleMarker([p[1],p[2]], style).addTo(map).bindTooltip(p[0]+'<small>'+p[4]+'</small>',
    {permanent:true, direction:dirs[p[0]]||'right', className:'lbl'+(p[3]==='hut'?' hut':'')});
});
L.control.scale({metric:true, imperial:false, maxWidth:180, position:'bottomleft'}).addTo(map);
map.fitBounds(L.latLngBounds(all), {padding:[80,70]});
</script></body></html>
